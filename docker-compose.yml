services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: storefront
    # Жодного опублікованого порту: база доступна лише всередині
    # docker-мережі за іменем `postgres:5432`. Ні з хоста, ні з
    # локальної мережі до неї не достукатись — тільки з backend.
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d storefront']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — локальна заміна Cloudflare R2 на час розробки: те саме S3 API,
  # тож код бекенду однаковий. Порт НЕ опублікований: картинки браузер
  # тягне через nginx (/media/), як і все інше.
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - '9000'
    volumes:
      - miniodata:/data

  # Одноразовий контейнер: створює бакет і робить його публічним на
  # читання, щоб <img src> працював без підпису запиту. Чекаємо на MinIO
  # циклом, а не healthcheck-ом: у свіжих образах minio немає `mc`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/storefront-media &&
      mc anonymous set download local/storefront-media &&
      echo 'Бакет storefront-media готовий'
      "

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Ім'я хоста тут — `postgres`, а не localhost: усередині
      # docker-мережі сервіси бачать один одного за іменем сервісу.
      DATABASE_URL: 'postgresql://postgres:password@postgres:5432/storefront?schema=public'
      # Секрети dev-only, як і в my-blog: не справжні, тому їх можна
      # тримати прямо в docker-compose.yml. Реальні прийдуть на проді.
      JWT_SECRET: 'dev-secret-change-me'
      PORT: 5051
      # Сховище зображень. За замовчуванням — локальний MinIO. Щоб перейти
      # на Cloudflare R2, достатньо покласти ці п'ять змінних у файл .env
      # поруч (він у .gitignore): compose підхопить їх замість дефолтів.
      S3_ENDPOINT: '${S3_ENDPOINT:-http://minio:9000}'
      S3_BUCKET: '${S3_BUCKET:-storefront-media}'
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:-minioadmin}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:-minioadmin}'
      # Адреса, за якою картинку тягне браузер (з боку хоста), — через nginx.
      S3_PUBLIC_URL: '${S3_PUBLIC_URL:-http://localhost/media/storefront-media}'
    volumes:
      # Код монтуємо з хоста — так nodemon усередині контейнера бачить
      # зміни одразу, без перезбірки образу.
      - ./backend:/app
      # Але node_modules — свій, контейнерний: інакше локальний
      # (macOS) node_modules перекрив би той, що зібрав Linux-образ.
      - /app/node_modules
    # Порт теж не опублікований — бекенд доступний тільки через nginx.
    expose:
      - '5051'
    # generate/migrate deploy виконуємо тут, а не в Dockerfile: до
    # старту контейнера DATABASE_URL ще не існує (він приходить саме
    # з цього environment-блока). Нову міграцію після зміни схеми
    # створюють вручну: docker compose exec backend npx prisma migrate dev.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Для запитів з боку сервера (Server Components) — напряму в
      # docker-мережу, в обхід nginx. Браузер (клієнтські запити) йде
      # відносним шляхом "/api/...", бо для нього все за nginx —
      # один origin, і CORS тут ні до чого.
      BACKEND_INTERNAL_URL: 'http://backend:5051'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    expose:
      - '3000'

  nginx:
    build: ./nginx
    depends_on:
      - backend
      - frontend
      - minio
    # Єдиний сервіс з портом, відкритим на хост — усі запити йдуть
    # тільки сюди.
    ports:
      - '80:80'

volumes:
  pgdata:
  miniodata:
