events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server backend:5051;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://backend;
        }

        # Тимчасово (до Етапу 3): фронтенду ще немає, тож корінь теж
        # веде на бекенд — щоб уже зараз перевіряти весь ланцюжок
        # nginx → backend → postgres одним запитом. Коли з'явиться
        # frontend-контейнер, цей location зміниться на upstream frontend,
        # а /api/ так і лишиться на backend — точно як у my-blog.
        location / {
            proxy_pass http://backend;
        }
    }
}
