events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # "Connection: upgrade" лише коли запит справді цього просить
    # (HMR-вебсокет) — звичайні запити мають отримувати "close"/"".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:5051;
    }

    upstream minio {
        server minio:9000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            # За замовчуванням nginx приймає тіло до 1 МБ і відповідає 413 —
            # завантаження картинки (до 5 МБ + службові байти multipart)
            # без цього ніколи б не дійшло до бекенду.
            client_max_body_size 6m;
            proxy_pass http://backend;
        }

        # Картинки з бакета (MinIO локально). Префікс /media/ відрізається:
        # /media/storefront-media/products/... -> minio:9000/storefront-media/products/...
        # Тільки читання — записує в сховище виключно бекенд.
        location /media/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://minio/;
        }

        # Усе інше — на фронтенд.
        location / {
            proxy_pass http://frontend;

            # УВАГА: щойно location додає СВІЙ хоч один proxy_set_header,
            # nginx перестає успадковувати ВСІ серверні (Host і решта
            # вище) — доводиться повторити їх тут явно. Без Host тут
            # Next.js бачив би "frontend:3000" замість "localhost" і
            # відхиляв Server Actions як CSRF (Origin ≠ Host).
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Потрібно для hot-reload у dev-режимі Next.js (HMR-вебсокет).
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
